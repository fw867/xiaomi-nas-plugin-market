# 网络邻居插件：整棵 /plugin/<用户>/netneighbor/ 都代理给插件服务（18190）。
#
# 注意：**不要**把 index.html 改成 alias 静态文件。页面里的 __SESSION_TOKEN__ /
# __CSRF_TOKEN__ 只有插件服务会替换，直接发文件会让页面拿到空令牌，
# 于是所有 /api/ 接口都返回 401「请从小米智能存储客户端重新打开插件」。
# 静态资源（app.js / styles.css）也一并代理，保持与 transmission / webdav 一致。

location ~ ^/plugin/([^/]+)/netneighbor/?$ {
    rewrite ^/plugin/([^/]+)/netneighbor/?$ /plugin/$1/netneighbor/index.html last;
}

location ~ ^/plugin/[^/]+/netneighbor/(.*)$ {
    proxy_pass http://127.0.0.1:18190/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_read_timeout 60s;
    proxy_hide_header Server;
}
