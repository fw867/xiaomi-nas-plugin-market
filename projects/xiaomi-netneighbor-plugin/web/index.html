<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)">
    <meta name="nn-session" content="__SESSION_TOKEN__">
    <meta name="csrf-token" content="__CSRF_TOKEN__">
    <title>网络邻居</title>
    <link rel="stylesheet" href="styles.css?v=__PLUGIN_VERSION__">
</head>
<body>
    <div id="nn-app">
        <header class="topbar">
            <button id="back" class="icon-button" title="返回" aria-label="返回">&#8249;</button>
            <strong>网络邻居</strong>
            <button id="refresh" class="icon-button" title="刷新" aria-label="刷新">&#8635;</button>
        </header>

        <main>
            <p id="error" class="alert" role="alert" hidden></p>

            <!-- 卡片一：网络发现开关 + 主机名 -->
            <section class="card">
                <label class="switch-row" for="discoverySwitch">
                    <span class="switch-label">网络发现</span>
                    <span class="switch">
                        <input id="discoverySwitch" type="checkbox">
                        <span class="slider" aria-hidden="true"></span>
                    </span>
                </label>

                <div class="status-main">
                    <span class="status-dot" id="statusDot" aria-hidden="true"></span>
                    <strong id="serviceState" role="status">正在读取</strong>
                </div>

                <div class="host-row">
                    <input id="hostnameInput" type="text" inputmode="text" autocomplete="off"
                           spellcheck="false" maxlength="15" aria-label="主机名" placeholder="SmartStorage">
                    <button id="hostnameSave" class="btn primary" type="button">保存</button>
                    <button id="hostnameReset" class="btn" type="button"
                            title="清掉插件里设置的名字，回到系统配置里的名字">恢复默认</button>
                </div>
            </section>

            <!-- 卡片二：共享目录（上部「添加共享」按钮，下部已共享目录列表，行尾 `-` 删除） -->
            <section class="card">
                <h2>共享目录</h2>
                <p id="accountLine" class="muted"></p>
                <button id="addShare" class="btn primary block" type="button">添加共享</button>
                <h3 class="share-heading">已共享的目录</h3>
                <div id="shares" class="shares"></div>
            </section>

            <!-- 目录浏览器：位置切换（存储池 / 外接存储）+ 当前完整绝对路径 + 逐层进入 +
                 「上一级」+「选择此目录」；也可以直接手填绝对路径（如 /nas/mnt/usb/下载） -->
            <dialog id="browseDialog" class="dialog">
                <div class="dialog-body">
                    <h2>选择目录</h2>
                    <div id="browseRoots" class="roots" hidden></div>
                    <div class="browse-path-row">
                        <button id="browseUp" class="btn small" type="button"
                                title="上一级" aria-label="上一级">上一级</button>
                        <code id="browsePath">—</code>
                    </div>
                    <div id="browseList" class="browse-list"></div>
                    <div class="path-row">
                        <input id="manualPath" type="text" inputmode="text" autocomplete="off"
                               spellcheck="false" aria-label="共享目录的绝对路径"
                               placeholder="绝对路径，如 /nas/mnt/usb">
                        <button id="manualAdd" class="btn" type="button">直接添加</button>
                    </div>
                    <p class="dialog-hint">可填 /nas/mnt 下的目录（如 /nas/mnt/usb）</p>
                    <p id="browseError" class="dialog-error" role="alert"></p>
                    <div class="dialog-actions">
                        <button id="browseCancel" class="btn" type="button">取消</button>
                        <button id="selectFolder" class="btn primary" type="button">选择此目录</button>
                    </div>
                </div>
            </dialog>

            <footer id="version">__PLUGIN_VERSION__</footer>
        </main>

        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script src="app.js?v=__PLUGIN_VERSION__"></script>
</body>
</html>
