<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Transmission</title>
    <style>
        /* 专为首页小组件做的极简统计页：内容少、字大、3 秒自刷新。
           背景保持透明，让宿主卡片的底色透出来。 */
        :root {
            --ink: #17212f;
            --muted: #6b7684;
            --down: #2f84f6;
            --up: #1f9d63;
            --warn: #c2603a;
        }
        @media (prefers-color-scheme: dark) {
            :root { --ink: #e6ecf3; --muted: #94a1b2; --down: #6aa9ff; --up: #4dc48d; --warn: #e2a189; }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: transparent;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            padding: 12px 14px;
            -webkit-font-smoothing: antialiased;
        }
        .speeds { display: flex; gap: 12px; }
        .speed { flex: 1 1 0; min-width: 0; }
        .speed .label { display: block; font-size: 11.5px; color: var(--muted); }
        .speed .value {
            display: block;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .down .value { color: var(--down); }
        .up .value { color: var(--up); }
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 2px 12px;
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .meta b { color: var(--ink); font-weight: 650; }
        .err { font-size: 12px; color: var(--warn); overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div class="speeds">
        <div class="speed down">
            <span class="label">下载</span>
            <span class="value" id="dl">—</span>
        </div>
        <div class="speed up">
            <span class="label">上传</span>
            <span class="value" id="ul">—</span>
        </div>
    </div>
    <div class="meta">
        <span>做种 <b id="seeding">—</b></span>
        <span>下载中 <b id="downloading">—</b></span>
        <span>启动以来 ↓<b id="sessionDown">—</b> ↑<b id="sessionUp">—</b></span>
    </div>
    <div class="err" id="err" hidden></div>
    <script>
    (function () {
        'use strict';
        const $ = (id) => document.getElementById(id);

        // Windows 客户端 location 可能带盘符（/D:/plugin/...），按仓库其它插件一样剥掉
        const base = (() => {
            const path = window.location.pathname.replace(/^\/[A-Za-z]:/, '');
            return new URL(path.replace(/[^/]*$/, ''), window.location.origin);
        })();

        function rate(bytes) {
            const value = Number(bytes) || 0;
            if (value >= 1048576) return (value / 1048576).toFixed(1) + ' MB/s';
            if (value >= 1024) return (value / 1024).toFixed(1) + ' KB/s';
            return value.toFixed(0) + ' B/s';
        }

        function size(bytes) {
            const value = Number(bytes) || 0;
            if (value >= 1073741824) return (value / 1073741824).toFixed(2) + ' GB';
            return (value / 1048576).toFixed(0) + ' MB';
        }

        // Transmission 的任务状态：3 排队下载 4 下载中 5 排队做种 6 做种中
        function countByState(items) {
            let seeding = 0;
            let downloading = 0;
            for (const item of items) {
                const status = Number(item.status);
                if (status === 6 || status === 5) seeding += 1;
                else if (status === 4 || status === 3) downloading += 1;
            }
            return { seeding, downloading };
        }

        async function tick() {
            try {
                const response = await fetch(new URL('api/torrents', base).href, { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok || data.ok === false) {
                    throw new Error(data.error || ('HTTP ' + response.status));
                }
                const transfer = data.transfer || {};
                const counts = countByState(data.items || []);
                $('dl').textContent = rate(transfer.dlspeed);
                $('ul').textContent = rate(transfer.upspeed);
                $('seeding').textContent = counts.seeding;
                $('downloading').textContent = counts.downloading;
                $('sessionDown').textContent = size(transfer.downloaded);
                $('sessionUp').textContent = size(transfer.uploaded);
                $('err').hidden = true;
            } catch (error) {
                const box = $('err');
                box.hidden = false;
                box.textContent = '读取失败：' + (error.message || error);
            }
        }

        tick();
        setInterval(() => { if (!document.hidden) tick(); }, 3000);
    })();
    </script>
</body>
</html>
