location ~ ^/plugin/([^/]+)/transmission/?$ {
    rewrite ^/plugin/([^/]+)/transmission/?$ /plugin/$1/transmission/index.html last;
}
location ~ ^/plugin/[^/]+/transmission/(.*)$ {
    proxy_pass http://127.0.0.1:18140/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_read_timeout 45s;
    # 控制台的 RPC（/rpc）要能上传 .torrent，base64 后体积会涨三分之一
    client_max_body_size 4m;
    proxy_hide_header Server;
}
