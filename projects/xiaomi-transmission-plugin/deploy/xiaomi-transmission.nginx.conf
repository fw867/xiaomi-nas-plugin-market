# 插件接口与 daemon RPC 都经插件服务反代：
#   <base>/api/...  → 插件设置接口（127.0.0.1:18140）
#   <base>/rpc      → transmission RPC（插件再转发到 daemon 的回环端口）
# 其余路径为静态文件（设置页、transmission-web-control）。
#
# transmission-web-control 的 RPC 地址是相对页面的 `../rpc`，
# 所以 twc/index.html 必须与 rpc 同处一级目录之下，不能改成 `twc/html/`。

location ~ ^/plugin/[^/]+/transmission/api/(.*)$ {
    proxy_pass http://127.0.0.1:18140/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}

# 正则 location 里 proxy_pass 不能带字面 URI，必须含变量才合法，
# 所以用捕获组把 /rpc 带过去。
location ~ ^/plugin/[^/]+/transmission(/rpc)$ {
    proxy_pass http://127.0.0.1:18140$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Transmission-Session-Id $http_x_transmission_session_id;
    proxy_pass_request_headers on;
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}

location ~ ^/plugin/([^/]+)/transmission/?$ {
    rewrite ^/plugin/([^/]+)/transmission/?$ /plugin/$1/transmission/index.html last;
}

location ~ ^/plugin/(?<transmission_user>[^/]+)/transmission/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/transmission/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_transmission_session=1; Path=/plugin/$transmission_user/transmission/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/transmission/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/transmission/src/ui/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
