# 设备管家的接口都在 /api/ 下（nas-status 取全量、live-metrics 供轮询）。
# 必须按前缀代理：只写死单个端点时，后加的接口会掉到下面的静态 alias，
# 变成「找不到文件」的 404，页面就一直停在「离线演示」。
location ~ ^/plugin/[^/]+/devicemanager/api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/plugin/[^/]+/devicemanager/?$ {
    alias /home/__NAS_USER_ID__/plugin/devicemanager/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location ~ ^/plugin/(?<dm_user>[^/]+)/devicemanager/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/devicemanager/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_dm_session=1; Path=/plugin/$dm_user/devicemanager/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/devicemanager/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/devicemanager/src/ui/$1;
}
