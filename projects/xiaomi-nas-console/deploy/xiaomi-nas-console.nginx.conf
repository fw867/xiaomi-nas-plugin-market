# 控制台的小米客户端入口：/plugin/<用户>/nasconsole/
#
# 客户端里打开的**不是**桌面版，而是移动端控制页（control.html）：
# 只有「桌面 Web 控制台」开关、访问地址和访问令牌——桌面版请用电脑浏览器打开，
# 这样桌面端可以专心做成桌面 OS 的样子。
#
# /api/ 全部转给只读服务 127.0.0.1:18100，并打上 X-Console-Entry: xiaomi，
# 服务据此认为"入口已由 nginx 鉴权"，不再要求二次登录。
#
# 注意：接口必须按前缀代理。若只写死单个端点，后加的接口会掉到下面的静态
# alias，变成找不到文件的 404。

location ~ ^/plugin/[^/]+/nasconsole/api/(.*)$ {
    proxy_pass http://127.0.0.1:18100/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Console-Entry xiaomi;
    proxy_read_timeout 60s;
}

location ~ ^/plugin/([^/]+)/nasconsole/?$ {
    rewrite ^/plugin/([^/]+)/nasconsole/?$ /plugin/$1/nasconsole/control.html last;
}

# 客户端可能直接请求 index.html——一律给它控制页
location ~ ^/plugin/(?<nc_user>[^/]+)/nasconsole/(index|control)\.html$ {
    alias /home/__NAS_USER_ID__/plugin/nasconsole/src/ui/control.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_nc_session=1; Path=/plugin/$nc_user/nasconsole/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/nasconsole/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/nasconsole/src/ui/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
