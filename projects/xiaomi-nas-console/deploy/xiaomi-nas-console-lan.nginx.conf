# 控制台的浏览器直连入口（仅局域网，不要把这个端口转发到公网）。
#
# 三个作用：
#   1. 桌面版页面与只读接口（代理到 127.0.0.1:18100）；
#   2. 已安装插件的网页入口：/plugin/... 统一转给本机 443 —— 那条路上挂着同一批
#      插件路由，而且插件看到的来源地址是回环 127.0.0.1。
#      为什么要绕这一下：这些插件（Jellyfin / Transmission / Emby / qB / 内网穿透…）
#      的信任判断是"客户端证书 DN 匹配，或者 X-Real-IP 是回环"，否则一律
#      401「请从设备所有者的小米客户端重新打开插件」。直连插件端口时
#      X-Real-IP 是浏览器地址，页面会渲染成拒绝态；绕回环后走的是插件本来
#      就给本机安装器留的那条信任路径，页面与接口都正常。
#   3. 插件图标：/data/plugin/www/icon 下的 png（小米客户端用自己的通道取）。
#
# 安全边界：走这里不需要客户端证书，凭据是桌面令牌 —— 关掉桌面入口即全部关闭。
#
# 端口可用安装脚本的 LAN_PORT 覆盖（默认 8085）。

server {
    listen __LAN_PORT__;
    listen [::]:__LAN_PORT__;
    server_name _;
    charset utf-8;
    client_max_body_size 64m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 插件页面与接口：绕本机 443（回环信任），保持同源因此可以直接放进窗口
    location ^~ /plugin/ {
        proxy_pass https://127.0.0.1$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        # 443 的门槛要求"客户端证书 / Authorization / token / cookie 至少有一个"，
        # 这里给一个占位 Authorization 让它放行（插件本身不看这个头）
        proxy_set_header Authorization "Bearer console-loopback";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 插件图标（.icon 实际是 png，必须显式给类型，否则 <img> 不认）
    location ^~ /plugin-icons/ {
        alias /data/plugin/www/icon/;
        default_type image/png;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 上传：不限制大小、不缓冲请求体（大文件一边收一边落盘）
    location ^~ /api/files/upload {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Console-Entry lan;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Console-Entry lan;
        proxy_read_timeout 60s;
    }
}
