location ~ ^/plugin/([^/]+)/emby/?$ {
    rewrite ^/plugin/([^/]+)/emby/?$ /plugin/$1/emby/index.html last;
}
location ~ ^/plugin/[^/]+/emby/(.*)$ {
    proxy_pass http://127.0.0.1:18150/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_read_timeout 45s;
    client_max_body_size 1m;
    proxy_hide_header Server;
}
