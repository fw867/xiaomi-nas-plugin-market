<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="csrf-token" content="__CSRF_TOKEN__" />
    <meta name="session-token" content="__SESSION_TOKEN__" />
    <title>插件市场</title>
    <link rel="stylesheet" href="styles.css?v=0.2.0" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-button" id="backButton" aria-label="返回" title="返回">
        <span aria-hidden="true">‹</span>
      </button>
      <span class="topbar-title">插件市场</span>
      <button class="icon-button refresh" id="refreshButton" aria-label="刷新" title="刷新">
        <span aria-hidden="true">↻</span>
      </button>
    </header>

    <main>
      <section id="featuredView" class="view active">
        <div class="section-heading"><h2>可用插件</h2><span id="updatedAt">正在读取仓库</span></div>
        <div id="packageList" class="package-grid" aria-live="polite"></div>
      </section>

      <section id="installedView" class="view">
        <div class="section-heading"><h2>已安装</h2><span>数据默认保留</span></div>
        <div id="installedList" class="package-grid"></div>
      </section>

      <section id="sourcesView" class="view">
        <div class="source-band">
          <div class="source-icon" aria-hidden="true">K</div>
          <div class="source-copy"><strong>Kingwell Community</strong><small>内置可信源 · ECDSA P-256</small></div>
          <span class="source-state">已启用</span>
        </div>
        <button class="add-source" disabled><span aria-hidden="true">＋</span>添加签名源</button>
        <p class="source-note">自定义源会在公钥指纹确认流程完成后开放。</p>
      </section>

      <section id="aboutView" class="view">
        <div class="about-card">
          <div class="about-row">
            <span class="about-label">当前版本</span>
            <span class="about-value" id="localVersion">读取中…</span>
          </div>
          <div class="about-row">
            <span class="about-label">最新版本</span>
            <span class="about-value" id="remoteVersion">检测中…</span>
          </div>
          <div class="about-row">
            <span class="about-label">更新状态</span>
            <span class="about-value" id="updateStatus">—</span>
          </div>
          <div class="about-actions">
            <button class="action-button" id="checkUpdateButton">检查更新</button>
            <button class="action-button primary" id="selfUpdateButton" hidden>立即更新</button>
            <a class="action-button" id="releaseLink" href="#" target="_blank" rel="noopener" hidden>Release 页</a>
          </div>
          <p class="about-note" id="updateNote"></p>
        </div>
        <div class="about-card">
          <div class="about-row">
            <span class="about-label">仓库</span>
            <span class="about-value"><a id="repoLink" href="https://github.com/fw867/xiaomi-nas-plugin-market" target="_blank" rel="noopener">fw867/xiaomi-nas-plugin-market</a></span>
          </div>
          <div class="about-row">
            <span class="about-label">声明</span>
            <span class="about-value">非小米官方产品</span>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="插件视图">
      <button class="tab active" data-view="featured"><span class="tab-icon" aria-hidden="true">▦</span><span class="tab-label">精选</span></button>
      <button class="tab" data-view="installed"><span class="tab-icon" aria-hidden="true">✓</span><span class="tab-label">已安装</span></button>
      <button class="tab" data-view="sources"><span class="tab-icon" aria-hidden="true">☁</span><span class="tab-label">来源</span></button>
      <button class="tab" data-view="about"><span class="tab-icon" aria-hidden="true">ⓘ</span><span class="tab-label">关于</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=0.2.0" defer></script>
  </body>
</html>
