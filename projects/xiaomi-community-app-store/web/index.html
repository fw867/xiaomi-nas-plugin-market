<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="csrf-token" content="__CSRF_TOKEN__" />
    <meta name="session-token" content="__SESSION_TOKEN__" />
    <title>插件市场</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-button" id="backButton" aria-label="返回" title="返回">
        <span aria-hidden="true"><svg viewBox="0 0 30 30" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M18.5 8.9 11.6 15l6.9 6.1" /></svg></span>
      </button>
      <span class="topbar-title">插件市场</span>
      <button class="icon-button refresh" id="refreshButton" aria-label="刷新" title="刷新">
        <span aria-hidden="true"><svg viewBox="0 0 25 25" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M19.35 12.5A6.85 6.85 0 1 1 12.5 5.65a7.42 7.42 0 0 1 5.12 2.08L19.35 9.46" /><path d="M19.35 5.65v3.81h-3.81" /></svg></span>
      </button>
    </header>

    <main>
      <section id="featuredView" class="view active">
        <div class="section-heading"><h2>可用插件</h2><span id="updatedAt">正在读取仓库</span></div>
        <div id="packageList" class="package-grid" aria-live="polite"></div>
      </section>

      <section id="installedView" class="view">
        <div class="section-heading"><h2>已安装</h2><span>数据默认保留</span></div>
        <div id="installedList" class="package-grid"></div>
      </section>

      <section id="rollbackView" class="view">
        <div class="section-heading"><h2>回滚</h2><span>用户数据保留</span></div>
        <div id="rollbackList" class="package-grid"></div>
      </section>

      <section id="aboutView" class="view">
        <div class="about-card">
          <div class="source-band">
            <div class="source-icon" aria-hidden="true">K</div>
            <div class="source-copy"><strong>Kingwell Community</strong><small>内置可信源 · ECDSA P-256</small></div>
            <span class="source-state">已启用</span>
          </div>
        </div>
        <div class="about-card">
          <div class="about-row">
            <span class="about-label">当前版本</span>
            <span class="about-value" id="localVersion">读取中…</span>
          </div>
          <div class="about-row">
            <span class="about-label">最新版本</span>
            <span class="about-value" id="remoteVersion">检测中…</span>
          </div>
          <div class="about-row">
            <span class="about-label">更新状态</span>
            <span class="about-value" id="updateStatus">—</span>
          </div>
          <div class="about-actions">
            <button class="action-button" id="checkUpdateButton">检查更新</button>
            <button class="action-button primary" id="selfUpdateButton" hidden>立即更新</button>
            <a class="action-button" id="releaseLink" href="#" target="_blank" rel="noopener" hidden>Release 页</a>
          </div>
          <p class="about-note" id="updateNote"></p>
        </div>
        <div class="about-card">
          <div class="about-row">
            <span class="about-label">旧版本</span>
            <span class="about-value">每个插件保留当前与上一版本</span>
          </div>
          <div class="about-actions">
            <button class="action-button" id="pruneButton">清理旧版本</button>
          </div>
          <p class="about-note" id="pruneNote">清理只删本商店安装留下的旧版本目录与注册表备份，不动插件数据和在用的注册表。</p>
        </div>
        <div class="about-card">
          <div class="about-row">
            <span class="about-label">仓库</span>
            <span class="about-value"><a id="repoLink" href="https://github.com/fw867/xiaomi-nas-plugin-market" target="_blank" rel="noopener">fw867/xiaomi-nas-plugin-market</a></span>
          </div>
          <div class="about-row">
            <span class="about-label">声明</span>
            <span class="about-value">非小米官方产品</span>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="插件视图">
      <button class="tab active" data-view="featured"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 20 20" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2" /><rect x="11.5" y="2.5" width="6" height="6" rx="1.2" /><rect x="2.5" y="11.5" width="6" height="6" rx="1.2" /><rect x="11.5" y="11.5" width="6" height="6" rx="1.2" /></svg></span><span class="tab-label">精选</span></button>
      <button class="tab" data-view="installed"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 20 20" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M2.3 11.2 8.2 16.8 17.6 3" /></svg></span><span class="tab-label">已安装</span></button>
      <button class="tab" data-view="rollback"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 20 20" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M2.17 10A7.83 7.83 0 1 0 10 2.17a8.48 8.48 0 0 0-5.86 2.38L2.17 6.52" /><path d="M2.17 2.17v4.35h4.35" /></svg></span><span class="tab-label">回滚</span></button>
      <button class="tab" data-view="about"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 20 20" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="10" cy="10" r="7.8" /><path d="M10 6.8h.01" /><path d="M10 9.8v4.2" /></svg></span><span class="tab-label">关于</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
