location ~ ^/plugin/[^/]+/sshcontrol/api/(.*)$ {
    proxy_pass http://127.0.0.1:18130/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/plugin/([^/]+)/sshcontrol/?$ {
    rewrite ^/plugin/([^/]+)/sshcontrol/?$ /plugin/$1/sshcontrol/index.html last;
}

location ~ ^/plugin/(?<ssh_user>[^/]+)/sshcontrol/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/sshcontrol/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_ssh_session=1; Path=/plugin/$ssh_user/sshcontrol/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/sshcontrol/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/sshcontrol/src/ui/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
