# 路由器软件中心：小米客户端入口（443 server 块里被 include）
#
# 三块路由：
#   /plugin/<用户>/rtrcenter/api/   插件自己的状态/设置接口（本机 127.0.0.1）
#   /plugin/<用户>/rtrcenter/site/  真实的路由器软件中心（反代到 __ROUTER_TARGET__）
#   /plugin/<用户>/rtrcenter/       插件外壳页面（顶栏 + iframe）
#
# 目标地址由插件服务在保存设置时渲染进这个文件（nginx -t 通过才 reload，失败回滚），
# 所以这个文件是"生成物"，改动请改插件里的模板。

location ^~ /plugin/__NAS_USER_ID__/rtrcenter/api/ {
    proxy_pass http://127.0.0.1:__PLUGIN_PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Console-Entry xiaomi;
    proxy_read_timeout 60s;
}

# 没有结尾斜杠时补上：前端所有接口都用"相对页面目录"的基址，必须保证页面 URL 以 / 结尾
location = /plugin/__NAS_USER_ID__/rtrcenter {
    return 301 /plugin/__NAS_USER_ID__/rtrcenter/;
}

# 真实软件中心：Authorization 原样透传（软件中心用 AdminToken 做鉴权），长轮询不缓冲
location ^~ /plugin/__NAS_USER_ID__/rtrcenter/site/ {
    proxy_pass __ROUTER_TARGET__;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 插件自己的页面
location ^~ /plugin/__NAS_USER_ID__/rtrcenter/ {
    alias /home/__NAS_USER_ID__/plugin/rtrcenter/src/ui/;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options nosniff;
}
