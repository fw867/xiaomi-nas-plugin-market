# Unifi（软件中心）：小米客户端入口（443 server 块里被 include）
#
# 路由（用户名用 [^/]+ 匹配，因为客户端请求里可能不带 u 前缀：
#       Android App 实测请求的是 /plugin/3943892/rtrcenter/index.html，
#       而注册表里叫 u3943892）：
#   /plugin/<用户名>/rtrcenter/               软件中心页面（插件服务本地化后返回）
#   /plugin/<用户名>/rtrcenter/api/…          软件中心的接口 → 路由器（Authorization 透传）
#   /plugin/<用户名>/rtrcenter/ctl/…          插件自己的接口（状态/设置/GitHub 转发）
#   /plugin/<用户名>/rtrcenter/view/…         兼容入口（同上）
#   /plugin/<用户名>/rtrcenter/<其它>         插件 UI 文件（设置页、图标、本地资源）
#
# 两个坑（都踩过）：
#   1) nginx 禁止在"正则 location"里写带 URI 的 proxy_pass（如 http://127.0.0.1:18101/root/），
#      必须用 rewrite ... break 改 URI，再配一个不带 URI 的 proxy_pass；
#   2) 目标地址不能带结尾斜杠（同上原因），所以 __ROUTER_TARGET__ 渲染成 http://IP:PORT。
#
# 这个文件是"生成物"：插件服务在保存设置时重新渲染它，nginx -t 通过才 reload，失败回滚。
# 改动请改插件里的模板（deploy/xiaomi-router-center.nginx.conf）。

# 软件中心页面：App 打开的就是这个路径，直接给本地化后的页面（不套 iframe）
location ~ ^/plugin/(?<rc_user>[^/]+)/rtrcenter/(?:index\.html|control(?:\.html)?|)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/.*$ /root/ break;
    proxy_pass http://127.0.0.1:__PLUGIN_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Console-Entry xiaomi;
    # 页面里的资源/接口要按"客户端实际用的用户名写法"来拼
    proxy_set_header X-Plugin-Prefix /plugin/$rc_user/rtrcenter;
    proxy_buffering off;
    proxy_read_timeout 120s;
}

# 软件中心自己的接口：原样转发到路由器（软件中心用 AdminToken 鉴权，必须透传）
location ~ ^/plugin/[^/]+/rtrcenter/api/(.*)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/api/(.*)$ /api/$1 break;
    proxy_pass __ROUTER_TARGET__;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 插件自己的接口：状态、设置、GitHub 转发
location ~ ^/plugin/[^/]+/rtrcenter/ctl/(.*)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/ctl/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:__PLUGIN_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Console-Entry xiaomi;
    proxy_read_timeout 120s;
}

# 兼容入口：页面与接口都走插件服务（老地址仍然可用）
location ~ ^/plugin/(?<rc_user2>[^/]+)/rtrcenter/view/(.*)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/view/(.*)$ /view/$1 break;
    proxy_pass http://127.0.0.1:__PLUGIN_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Console-Entry xiaomi;
    proxy_set_header X-Plugin-Prefix /plugin/$rc_user2/rtrcenter;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# 其余文件（设置页、图标、本地 Vue/Tailwind/Lucide、浮动按钮）直接从插件自己的目录发。
# 用 release 目录而不是 /home/<用户名>/...：这样配置不依赖用户名，商店安装也能直接用。
location ~ ^/plugin/[^/]+/rtrcenter/(.*)$ {
    alias /data/plugin/router-center/current/web/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options nosniff;
}
