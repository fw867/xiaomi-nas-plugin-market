# Unifi（软件中心）：小米客户端入口（443 server 块里被 include）
#
# 路由（用户名用 [^/]+ 匹配，因为客户端请求里可能不带 u 前缀：
#       Android App 实测请求的是 /plugin/3943892/rtrcenter/index.html，
#       而注册表里叫 u3943892）：
#   /plugin/<用户名>/rtrcenter/               软件中心页面（插件服务本地化后返回）
#   /plugin/<用户名>/rtrcenter/api/…          软件中心的接口 → 插件服务 → 路由器（Authorization 透传）
#   /plugin/<用户名>/rtrcenter/ctl/…          插件自己的接口（状态/设置/GitHub 转发）
#   /plugin/<用户名>/rtrcenter/view/…         兼容入口（同上）
#   /plugin/<用户名>/rtrcenter/<其它>         插件 UI 文件（设置页、图标、本地资源）
#
# 这个文件刻意**不含任何占位符**：商店安装是把它原样装到 /etc/nginx/conf.d/luci/ 的，
# 带双下划线占位符会直接让 nginx -t 失败、插件更新报错（踩过）。所以：
#   · 插件端口写死 18101（与打包清单一致）；
#   · 路由器接口不在这里配地址，而是转给插件服务（/view/api/… 由服务带上目标地址与令牌转发），
#     这样改目标地址只需要改设置、不必动 nginx。
#
# 两个 nginx 限制（都踩过）：
#   1) 正则 location 里不能写带 URI 的 proxy_pass，必须用 rewrite ... break + 不带 URI 的 proxy_pass；
#   2) 精确匹配（=）优先于 ^~ 前缀，正则会被 ^~ 前缀屏蔽。
#
# 改动请改插件里的模板（deploy/xiaomi-router-center.nginx.conf）。

# 软件中心页面：App 打开的就是这个路径，直接给本地化后的页面（不套 iframe）
location ~ ^/plugin/(?<rc_user>[^/]+)/rtrcenter/(?:index\.html|control(?:\.html)?|)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/.*$ /root/ break;
    proxy_pass http://127.0.0.1:18101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Console-Entry xiaomi;
    # 客户端证书信息：插件服务据此判断"是不是设备所有者的小米客户端"
    # （GET /api/settings 只对小米客户端回明文 AdminToken，见 server.settings_payload）。
    # 控制台电脑端那一跳没有客户端证书，$ssl_client_verify 是 NONE —— 正好用来区分。
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    # 页面里的资源/接口要按"客户端实际用的用户名写法"来拼
    proxy_set_header X-Plugin-Prefix /plugin/$rc_user/rtrcenter;
    proxy_buffering off;
    proxy_read_timeout 120s;
}

# 软件中心自己的接口：交给插件服务带目标地址与令牌转发（软件中心用 AdminToken 鉴权，必须透传）
#
# 注意 Authorization 是透传的：控制台电脑端那一跳（xiaomi-nas-console-lan.nginx.conf 里
# `proxy_set_header Authorization "Bearer console-loopback"`）会先把客户端凭据覆盖成占位值，
# 这个值到路由器就是"令牌不正确"。插件服务在 /view/ 转发前会认出这个占位值（engine.
# resolve_authorization）并换成插件自己保存的令牌（/data/plugin/router-center/router-token），
# 客户端自己带的真实令牌一律原样透传 —— 所以这里**不要**改成写死任何令牌。
location ~ ^/plugin/[^/]+/rtrcenter/api/(.*)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/api/(.*)$ /view/api/$1 break;
    proxy_pass http://127.0.0.1:18101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Console-Entry xiaomi;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 插件自己的接口：状态、设置、GitHub 转发
location ~ ^/plugin/[^/]+/rtrcenter/ctl/(.*)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/ctl/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:18101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Console-Entry xiaomi;
    # 设置页读 /api/settings 时也要带上客户端证书信息（否则永远只拿到提示、看不到明文令牌）
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_read_timeout 120s;
}

# 兼容入口：页面与接口都走插件服务（老地址仍然可用）
location ~ ^/plugin/(?<rc_user2>[^/]+)/rtrcenter/view/(.*)$ {
    rewrite ^/plugin/[^/]+/rtrcenter/view/(.*)$ /view/$1 break;
    proxy_pass http://127.0.0.1:18101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Console-Entry xiaomi;
    proxy_set_header X-Plugin-Prefix /plugin/$rc_user2/rtrcenter;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# 其余文件（设置页、图标、本地 Vue/Tailwind/Lucide、关闭按钮）直接从插件自己的目录发。
# 用 release 目录而不是 /home/<用户名>/...：这样配置不依赖用户名，商店安装也能直接用。
location ~ ^/plugin/[^/]+/rtrcenter/(.*)$ {
    alias /data/plugin/router-center/current/web/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options nosniff;
}
