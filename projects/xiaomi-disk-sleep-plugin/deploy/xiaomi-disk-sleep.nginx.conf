location ~ ^/plugin/[^/]+/disksleep/api/(.*)$ {
    proxy_pass http://127.0.0.1:18160/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ~ ^/plugin/([^/]+)/disksleep/?$ {
    rewrite ^/plugin/([^/]+)/disksleep/?$ /plugin/$1/disksleep/index.html last;
}

location ~ ^/plugin/(?<ds_user>[^/]+)/disksleep/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/disksleep/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_ds_session=1; Path=/plugin/$ds_user/disksleep/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/disksleep/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/disksleep/src/ui/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
