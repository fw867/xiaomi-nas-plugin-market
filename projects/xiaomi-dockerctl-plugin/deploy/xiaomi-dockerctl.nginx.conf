# Docker 控制台的小米客户端入口：/plugin/<用户>/dockerctl/
#
# 页面与接口都由插件进程（127.0.0.1:18210）提供，nginx 只做同源反向代理。
# 入口位于客户端证书站点里，服务端还会再校验一次
# X-Xiaomi-Client-Verify / X-Xiaomi-Client-DN（见 server.py trusted()），
# 不依赖 nginx 单层放行——这个插件能操作宿主机全部容器，权限等价 root。
location ~ ^/plugin/([^/]+)/dockerctl/?$ {
    rewrite ^/plugin/([^/]+)/dockerctl/?$ /plugin/$1/dockerctl/index.html last;
}

location ~ ^/plugin/[^/]+/dockerctl/(.*)$ {
    proxy_pass http://127.0.0.1:18210/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    client_max_body_size 16m;
    # 镜像拉取/Compose 部署这类长操作，与后端超时保持一致
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    proxy_hide_header Server;
}
